name: Build SEO pages

# Re-creates the product/category pages, sitemap and fallback catalogue from the
# admin panel database, so Google always sees current products and prices.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-seo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build pages from the database
        run: node scripts/build-seo.js

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A p c public/p public/c sitemap.xml public/sitemap.xml robots.txt public/robots.txt \
                     index.html public/index.html js/products.json public/js/products.json
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: rebuild SEO pages from the product database [skip ci]"
            git push
          fi
